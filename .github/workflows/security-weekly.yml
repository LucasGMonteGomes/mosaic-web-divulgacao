# Varredura completa de segurança, toda segunda-feira (documentacao/deploy.md no vault).
name: Segurança semanal

on:
  schedule:
    - cron: '0 9 * * 1' # segunda, 06h em Brasília
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
  TRIVY_IMAGE: aquasec/trivy:0.76.1
  SEMGREP_IMAGE: semgrep/semgrep:1.182.0

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # histórico completo para o gitleaks

      - name: Segredos em todo o histórico
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --redact --no-banner

      - name: Dependências vulneráveis (a partir de média)
        run: |
          docker run --rm -v "$PWD:/repo" "$TRIVY_IMAGE" \
            fs --scanners vuln --severity MEDIUM,HIGH,CRITICAL --exit-code 1 /repo

      - name: Análise de segurança do código
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --metrics=off --config p/typescript --config p/react \
            --config p/owasp-top-ten --config p/secrets --error
